name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Verify financial reconciliations
        run: node scripts/verify-finance.mjs

      - name: Verify debt landing page and sitemap artifact
        run: |
          test -s dist/national-debt/index.html
          grep -q 'UK National Debt Calculator' dist/national-debt/index.html
          grep -q 'https://uk-budget-explorer.github.io/national-debt/' dist/sitemap.xml
          grep -q 'national-debt/' dist/index.html || grep -q 'national-debt/' dist/assets/*.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

