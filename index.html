    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UK National Budget Explorer & Policy Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
    // Initialise gaConsent from localStorage before any GA code runs
    try {
      const stored = localStorage.getItem('gaConsent');
      if (stored === 'true') {
        window.gaConsent = true;
      } else if (stored === 'false') {
        window.gaConsent = false;
      } else {
        window.gaConsent = null;
      }
    } catch (e) { window.gaConsent = null; }
    // Load GA4 only if consent given
    if (window.gaConsent) {
      (function(){
        var g=document.createElement('script');
        g.async=true;
        g.src='https://www.googletagmanager.com/gtag/js?id=G-8SP4GE7VJW';
        document.head.appendChild(g);
      })();
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-8SP4GE7VJW', {'anonymize_ip': true});
    }
  </script>
</head>
  <body class="bg-slate-950 text-slate-100 antialiased font-sans selection:bg-blue-600 selection:text-white min-h-screen">

  </body>
